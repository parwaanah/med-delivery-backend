<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>💊 Medicine Delivery — Admin Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family:'Segoe UI',sans-serif;background:#0b0e12;color:#f5f5f5;margin:0;min-height:100vh; }
    header { background:#1e1f24;color:#00eaff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center; }
    #logoutBtn{ background:#ff005c;color:#fff;border:none;border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:600;margin-left:12px; }
    .tabs{ background:#14171c;display:flex;justify-content:center;gap:10px;padding:10px;border-bottom:1px solid #222;flex-wrap:wrap; }
    .tabs button{ background:#1c1f26;border:none;color:#ccc;padding:8px 14px;border-radius:5px;cursor:pointer;transition:.2s; }
    .tabs button.active{ background:#00eaff;color:#000;font-weight:bold; }
    section{ display:none;padding:16px; } section.active{ display:block; }
    h3{ color:#00eaff;margin-top:0; }
    table{ color:#ccc;width:100%;border-collapse:collapse; }
    td,th{ padding:8px;border-bottom:1px solid #222; }
    .event{ background:#16181d;border-left:4px solid #00ff99;padding:8px;margin-bottom:8px;border-radius:6px; }
    #loginOverlay{ position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,6,23,0.9);display:flex;align-items:center;justify-content:center;z-index:9999; }
    #loginBox{ background:#111827;padding:30px;border-radius:10px;width:360px; }
    #loginBox input{ width:100%;margin:6px 0;padding:10px;background:#0b1220;color:#fff;border:1px solid #1f2937;border-radius:6px; }
    #loginBox button{ margin-top:10px;width:100%;padding:10px;border:none;background:#00eaff;color:#00111a;border-radius:6px;cursor:pointer;font-weight:600; }
    #map { width:100%; height:420px; border-radius:8px; margin-top:12px; box-shadow:0 6px 18px rgba(0,0,0,0.5); }
    .legend { background:#111827;padding:8px;border-radius:6px;color:#fff; position:absolute; right:10px; top:10px; z-index:1000; }
    .small-btn{ padding:6px 10px;border-radius:6px;border:none;cursor:pointer;margin-right:6px; }
    #loginError{ color:#ff8b8b;margin-top:8px;display:none;text-align:center; }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div id="loginBox">
      <h2 style="color:#00eaff;">🔐 Admin Login</h2>
      <input id="email" type="email" value="superadmin_live@example.com" />
      <input id="password" type="password" value="superadmin123" />
      <button id="loginBtn">Login</button>
      <div id="loginError"></div>
    </div>
  </div>

  <header>
    <div>💊 Medicine Delivery — Admin Control</div>
    <div>
      <span id="userStatus">Not logged in</span>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </header>

  <div class="tabs">
    <button data-tab="audit" class="active">Audit</button>
    <button data-tab="metrics">Metrics</button>
    <button data-tab="surge">Surge</button>
    <button data-tab="heatmap">Heatmap</button>
    <button data-tab="queue">Queue</button>
    <button data-tab="health">Health</button>
    <button data-tab="users">Users</button>
  </div>

  <!-- AUDIT -->
  <section id="audit" class="active">
    <h3>🔍 Live Audit Feed</h3>
    <div style="margin-bottom:8px;">
      <button id="downloadAudit" class="small-btn" style="background:#00eaff;color:#00111a">Download JSON</button>
      <button id="clearCache" class="small-btn" style="background:#ffb020;color:#000">Clear Cache</button>
      <button id="refreshAudit" class="small-btn" style="background:#00ff99;color:#000">Refresh</button>
    </div>
    <div id="auditFeed"></div>
  </section>

  <!-- METRICS -->
  <section id="metrics">
    <h3>📊 System Metrics</h3>
    <table id="metricsTable"></table>
  </section>

  <!-- SURGE -->
  <section id="surge">
    <h3>⚡ Surge Info</h3>
    <div id="surgeInfo"></div>
  </section>

  <!-- HEATMAP -->
  <section id="heatmap">
    <h3>🗺️ Surge Heatmap</h3>
    <div style="position:relative;">
      <div id="map"></div>
      <div class="legend"><b>Legend</b><br/>● Low (x1.0)<br/>● Medium (x1.5)<br/>● High (x2.0)</div>
    </div>
  </section>

  <!-- QUEUE -->
  <section id="queue">
    <h3>⚙️ Redis Queue</h3>
    <div id="queueStatus"></div>
  </section>

  <!-- HEALTH -->
  <section id="health">
    <h3>💡 System Health</h3>
    <div id="healthStatus"></div>
  </section>

  <!-- USERS -->
  <section id="users">
    <h3>👥 User Management</h3>
    <div style="margin-bottom:10px;">
      <input id="userSearch" placeholder="Search name or email"
        style="width:50%;padding:8px;border-radius:6px;border:none;background:#0b1220;color:#fff;" />
      <button id="reloadUsers" class="small-btn" style="background:#00eaff;color:#00111a;">Reload</button>
      <button id="pendingOnly" class="small-btn" style="background:#555;color:#fff;">Pending Only</button>
      <button id="resetAllPending" class="small-btn" style="background:#ffb020;color:#000;">Reset All Pending</button>
      <button id="downloadReport" class="small-btn" style="background:#00eaff;color:#00111a;">Download Daily Report</button>
    </div>
    <table id="usersTable" border="1" cellspacing="0" cellpadding="6" style="width:100%;color:#ccc;background:#111827;border-radius:8px;"></table>
  </section>

<script>
const API = "http://localhost:3001";
let accessToken = localStorage.getItem("adminAccessToken") || null;
let pendingFilter = false;

/* ---------------- TAB UI ---------------- */
document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
  });
});

/* ---------------- LOGIN ---------------- */
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const err = document.getElementById("loginError");
  err.style.display = "none";
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Login failed");
    accessToken = data.accessToken;
    localStorage.setItem("adminAccessToken", accessToken);
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("logoutBtn").style.display = "inline-block";
    document.getElementById("userStatus").innerText = data.user.email;
    initDashboard();
  } catch (e) {
    err.innerText = e.message;
    err.style.display = "block";
  }
});
document.getElementById("logoutBtn").addEventListener("click", () => {
  accessToken = null; localStorage.clear();
  document.getElementById("loginOverlay").style.display = "flex";
  document.getElementById("logoutBtn").style.display = "none";
  document.getElementById("userStatus").innerText = "Not logged in";
});

/* ---------------- API WRAPPER ---------------- */
async function api(path, method="GET", body=null) {
  const headers = { "Content-Type": "application/json" };
  if (accessToken) headers.Authorization = `Bearer ${accessToken}`;
  const res = await fetch(`${API}${path}`, { method, headers, body: body?JSON.stringify(body):undefined });
  const data = await res.json().catch(()=>({}));
  return { ok: res.ok, data };
}

/* ---------------- USERS ---------------- */
function bindUserTabButtons() {
  document.getElementById("reloadUsers").onclick = fetchUsers;
  document.getElementById("pendingOnly").onclick = () => { pendingFilter = !pendingFilter; fetchUsers(); };
  document.getElementById("resetAllPending").onclick = async () => {
    const { ok, data } = await api("/admin/users/reset-all-pending", "POST");
    alert(ok ? (data.message || "Queued resets") : "Failed");
  };
  document.getElementById("downloadReport").onclick = async () => {
    const { ok } = await api("/admin/reports/daily", "POST");
    alert(ok ? "Report generated" : "Failed to generate");
  };
  document.getElementById("userSearch").oninput = e => fetchUsers(e.target.value);
}

async function fetchUsers(query="") {
  const { ok, data } = await api("/users");
  if (!ok) return alert("Failed to load users");
  let users = data;
  if (pendingFilter) users = users.filter(u => u.status === "PENDING");
  if (query) users = users.filter(u =>
    (u.email||"").toLowerCase().includes(query.toLowerCase()) ||
    (u.name||"").toLowerCase().includes(query.toLowerCase())
  );
  const table = document.getElementById("usersTable");
  table.innerHTML = `<tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>`;
  users.forEach(u => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.id}</td><td>${u.name||""}</td><td>${u.email||""}</td><td>${u.role||""}</td><td>${u.status||""}</td>
      <td>
        <button class="small-btn" style="background:#28a745;color:#fff" onclick="approveUser(${u.id})">Approve</button>
        <button class="small-btn" style="background:#d33;color:#fff" onclick="rejectUser(${u.id})">Reject</button>
        <button class="small-btn" style="background:#00eaff;color:#00111a" onclick="sendReset(${u.id},'${u.email}')">Reset</button>
      </td>`;
    table.appendChild(tr);
  });
}

window.approveUser = async id => {
  const { ok, data } = await api(`/admin/users/${id}/approve`, "PATCH");
  alert(ok ? (data.message || "Approved") : "Failed");
  if (ok) fetchUsers();
};
window.rejectUser = async id => {
  const { ok, data } = await api(`/admin/users/${id}/reject`, "PATCH");
  alert(ok ? (data.message || "Rejected") : "Failed");
  if (ok) fetchUsers();
};
window.sendReset = async (id, email) => {
  const { ok } = await api(`/admin/users/${id}/reset-password`, "POST");
  alert(ok ? `Reset queued for ${email}` : "Failed");
};

/* ---------------- AUDIT ---------------- */
async function fetchAudit() {
  const { ok, data } = await api("/admin/audit/logs?page=1&limit=20");
  if (!ok) return;
  const feed = document.getElementById("auditFeed");
  feed.innerHTML = "";
  (data.logs || []).forEach(e => {
    const div = document.createElement("div");
    div.className = "event";
    div.innerHTML = `<b>${e.eventType}</b> — ${e.email||"N/A"}<br/><small>${new Date(e.timestamp).toLocaleString()}</small>`;
    feed.prepend(div);
  });
}
document.getElementById("refreshAudit").addEventListener("click", fetchAudit);
document.getElementById("downloadAudit").addEventListener("click", async () => {
  const { ok, data } = await api("/admin/audit/logs?page=1&limit=1000");
  if (!ok) return alert("Failed to download audit");
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "audit.json"; a.click();
});
document.getElementById("clearCache").addEventListener("click", async () => {
  const { ok } = await api("/admin/cache/clear", "POST");
  alert(ok ? "Cache cleared" : "Failed");
});

/* ---------------- DASHBOARD INIT ---------------- */
async function initDashboard() {
  await Promise.all([fetchAudit(), fetchUsers()]);
  bindUserTabButtons();
}
if (accessToken) {
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("logoutBtn").style.display = "inline-block";
  document.getElementById("userStatus").innerText = "admin";
  initDashboard();
}
</script>
</body>
</html>
