<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧠 Admin Control Center</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0b0e12; color: #f5f5f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e1f24; color: #00eaff; padding: 12px 24px; border-bottom: 1px solid #222; font-size: 1.2em; display: flex; justify-content: space-between; }
    nav { background: #14171c; display: flex; justify-content: center; gap: 8px; padding: 10px; border-bottom: 1px solid #222; }
    nav button { background: #1c1f26; border: none; color: #ccc; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
    nav button.active { background: #00eaff; color: #000; font-weight: 600; }
    .tab { display: none; flex: 1; overflow-y: auto; padding: 16px; }
    .tab.active { display: block; }
    .event { background: #16181d; margin-bottom: 12px; padding: 10px; border-radius: 6px; border-left: 5px solid; }
    .success { border-color: #00ff99; } .fail { border-color: #ff3b3b; }
    canvas { width: 100%; height: 220px; }
    .bar { background: #222; border-radius: 4px; margin: 6px 0; height: 18px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.3s ease; }
  </style>
</head>
<body>
  <header>
    🧠 Admin Control Center
    <span id="lastUpdate" style="font-size:0.8em;color:#999;"></span>
  </header>
  <nav>
    <button class="active" data-tab="auditTab">Audit Logs</button>
    <button data-tab="metricsTab">System Metrics</button>
    <button data-tab="queueTab">Redis Queue Monitor</button>
  </nav>

  <div id="auditTab" class="tab active">
    <h3>🔍 Live Audit Feed</h3>
    <canvas id="auditChart"></canvas>
    <div id="feed"></div>
  </div>

  <div id="metricsTab" class="tab">
    <h3>📊 System Metrics</h3>
    <table id="metricsTable"></table>
    <canvas id="metricsChart" height="120"></canvas>
  </div>

  <div id="queueTab" class="tab">
    <h3>⚙️ Redis Queue Monitor</h3>
    <div id="queueStatus"></div>
  </div>

  <script>
    const socket = io("http://localhost:3001/audit-live");
    const feed = document.getElementById("feed");
    const auditCtx = document.getElementById("auditChart").getContext("2d");
    const auditData = { labels: [], total: [] };
    const auditChart = new Chart(auditCtx, {
      type: "line",
      data: { labels: auditData.labels, datasets: [{ label: "Total Events", data: auditData.total, borderColor: "#00eaff", fill: true, backgroundColor: "rgba(0,234,255,0.2)" }] },
      options: { plugins: { legend: { labels: { color: "#ccc" } } } }
    });
    function addAuditEvent(e) {
      const div = document.createElement("div");
      div.className = `event ${e.success ? "success" : "fail"}`;
      div.innerHTML = `<b>${e.eventType}</b> — ${e.email || "N/A"} (${e.role || "?"})<br><span style="color:#999;font-size:0.8em;">${new Date(e.timestamp).toLocaleTimeString()}</span>`;
      feed.prepend(div);
      const now = new Date().toLocaleTimeString();
      auditData.labels.push(now);
      auditData.total.push((auditData.total.slice(-1)[0] || 0) + 1);
      if (auditData.labels.length > 12) { auditData.labels.shift(); auditData.total.shift(); }
      auditChart.update();
    }
    socket.on("audit_event", addAuditEvent);

    // Metrics polling
    const metricsData = { labels: [], cpu: [], mem: [] };
    const chartCtx = document.getElementById("metricsChart").getContext("2d");
    const metricsChart = new Chart(chartCtx, {
      type: "line",
      data: { labels: metricsData.labels, datasets: [
        { label: "CPU Load", data: metricsData.cpu, borderColor: "#00eaff" },
        { label: "Memory Used (MB)", data: metricsData.mem, borderColor: "#00ff99" }
      ]},
      options: { plugins: { legend: { labels: { color: "#ccc" } } } }
    });
    async function fetchMetrics() {
      try {
        const res = await fetch("/admin/metrics");
        const data = await res.json();
        const sys = data.system;
        document.getElementById("metricsTable").innerHTML = `
          <tr><td>Hostname</td><td>${sys.hostname}</td></tr>
          <tr><td>CPU Load</td><td>${sys.cpuLoad1m}</td></tr>
          <tr><td>Memory Used</td><td>${sys.usedMemMB}/${sys.totalMemMB} MB</td></tr>
          <tr><td>DB Connections</td><td>${data.database.activeConnections}</td></tr>
        `;
        const now = new Date().toLocaleTimeString();
        metricsData.labels.push(now);
        metricsData.cpu.push(sys.cpuLoad1m);
        metricsData.mem.push(sys.usedMemMB);
        if (metricsData.labels.length > 10) { metricsData.labels.shift(); metricsData.cpu.shift(); metricsData.mem.shift(); }
        metricsChart.update();
        document.getElementById("lastUpdate").textContent = "Updated: " + now;
      } catch {}
    }
    setInterval(fetchMetrics, 10000); fetchMetrics();

    // Queue Monitor
    const queueStatus = document.getElementById("queueStatus");
    const queueSocket = io("http://localhost:3001/queue-live");
    queueSocket.on("queue_update", (data) => renderQueues(data));
    async function fetchQueueFallback() {
      try { const res = await fetch("/admin/queue/status"); renderQueues(await res.json()); }
      catch { queueStatus.innerHTML = "<div style='color:#999;'>Queue data unavailable.</div>"; }
    }
    function renderQueues(data) {
      const queues = data.queues || {};
      queueStatus.innerHTML = "";
      Object.entries(queues).forEach(([name, q]) => {
        queueStatus.innerHTML += `
          <h4 style="color:#00eaff;">${name.toUpperCase()} Queue</h4>
          <div>🟢 Active: ${q.active}</div>
          <div>🕓 Waiting: ${q.waiting}</div>
          <div>✅ Completed: ${q.completed}</div>
          <div>❌ Failed: ${q.failed}</div>
          <div class="bar"><div class="bar-fill" style="width:${Math.min(q.completed / (q.completed + q.failed + 1) * 100, 100)}%; background:#00ff99;"></div></div><br>`;
      });
      document.getElementById("lastUpdate").textContent = "Updated: " + new Date().toLocaleTimeString();
    }
    setInterval(fetchQueueFallback, 10000);
    fetchQueueFallback();

    document.querySelectorAll("nav button").forEach((btn) => btn.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    }));
  </script>
</body>
</html>
