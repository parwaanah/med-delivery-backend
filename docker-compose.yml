version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: med_delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hello@123
      POSTGRES_DB: med_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mednet

  redis:
    image: redis:7
    container_name: med_delivery_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mednet

  backend:
    build: .
    container_name: med_delivery_backend
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - mednet

volumes:
  postgres_data:
  redis_data:

networks:
  mednet:
    driver: bridge
