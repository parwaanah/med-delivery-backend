services:
  postgres:
    image: postgres:15
    container_name: med_delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hello@123
      POSTGRES_DB: med_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mednet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d med_delivery"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: med_delivery_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mednet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: med_delivery_backend
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - mednet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../uskery-frontend
      dockerfile: Dockerfile
    container_name: med_delivery_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../uskery-frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev", "--", "--port", "3000", "--hostname", "0.0.0.0"]
    networks:
      - mednet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000',r=>process.exit(r.statusCode>=200&&r.statusCode<500?0:1)).on('error',()=>process.exit(1));\""
        ]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  mednet:
    driver: bridge
